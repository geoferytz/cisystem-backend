spring.application.name=inventory

server.port=${APP_PORT:8083 }

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cisystem}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:16537}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=true

app.security.jwt.secret=${JWT_SECRET:change-me-in-env}
app.security.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:60}

# WhatsApp Business Cloud API - disabled until credentials are set in the server .env
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
app.whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:sw}
app.whatsapp.receipt-template=${WHATSAPP_RECEIPT_TEMPLATE:sales_receipt}
app.whatsapp.debt-template=${WHATSAPP_DEBT_TEMPLATE:debt_reminder}
app.whatsapp.auto-receipt=${WHATSAPP_AUTO_RECEIPT:true}
app.whatsapp.reminder-min-days=${WHATSAPP_REMINDER_MIN_DAYS:3}
